services:
  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432" # Expose PostgreSQL port for local development
  ###< doctrine/doctrine-bundle ###

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web interface
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - backend
  ###< symfony/mailer ###

networks:
  backend:
    driver: bridge
